name: E2E

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sarradabet_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sarradabet_test
  JWT_SECRET: e2e-test-secret
  MERCADOPAGO_MOCK_PIX: "true"
  REDIS_URL: redis://localhost:6379
  CORS_ORIGINS: http://localhost:3002
  NODE_ENV: development

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sarradabet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sarradabet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clone platform design system
        run: |
          git clone --depth 1 https://github.com/SarradaHub/platform.git ../platform || true
          npm run build:design-system

      - name: Generate Prisma client
        working-directory: apps/api
        run: npm run prisma:generate

      - name: Prepare database
        working-directory: apps/api
        run: |
          npm run prisma:migrate:deploy
          npm run db:seed:simple

      - name: Build applications
        run: npm run build

      - name: Start API server
        working-directory: apps/api
        run: |
          npm run start &
          npx wait-on http://localhost:8000/health --timeout 60000

      - name: Start web preview
        working-directory: apps/web
        run: |
          npm run preview -- --port 3002 --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:3002 --timeout 60000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run E2E smoke tests
        working-directory: e2e
        env:
          CI: true
          E2E_SKIP_WEBSERVER: "true"
          E2E_BASE_URL: http://127.0.0.1:3002
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/cucumber-report/
            e2e/test-results/
          retention-days: 14
